name: Publish to GitHub Pages

# Pages is served from the `gh-pages` branch. This workflow mirrors the
# site there on every push, so the live page stays in sync. It uses only
# the built-in GITHUB_TOKEN (contents: write) — no Pages-admin API calls,
# which this account blocks for integration tokens.

on:
  push:
    branches: [claude/youthful-shannon-lxrluu]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git checkout --orphan gh-pages-deploy
          git add -A
          git commit -m "Deploy: ${GITHUB_SHA::7}"
          git push -f origin gh-pages-deploy:gh-pages
